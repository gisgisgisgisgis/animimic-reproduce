[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "animimic-reproduce"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=6", "Pillow>=10"]

[project.optional-dependencies]
gpu = ["torch==2.6.0", "torchvision==0.21.0", "diffusers==0.35.1", "transformers==4.51.3", "accelerate>=1.2,<2", "imageio[ffmpeg]", "warp-lang==1.19.0", "scipy", "trimesh", "meshio", "fast-simplification"]

[project.scripts]
animimic = "animimic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
