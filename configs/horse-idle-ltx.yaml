asset: horse
camera:
  width: 768
  height: 448
  azimuth: 65
  elevation: 5
  distance: 1.5
  lighting: studio
  srgb: true
video:
  backend: ltx
  prompt: >-
    Animate the single stylized 3D saddled horse already present in the input image.
    It remains in the same place and orientation, with all four hooves planted.
    Only its head makes one small, slow nod and returns to its starting pose.
    Its torso, legs, saddle, proportions and colors remain unchanged.
    A locked-off camera keeps the entire horse visible at constant scale.
    The plain background and lighting stay unchanged.
    One continuous shot, exactly one horse throughout.
  negative_prompt: >-
    second horse, duplicate horse, extra animal, animal entering the frame,
    people, rider, walking, running, trotting, galloping, stepping, sliding hooves,
    drifting body, turning body, camera movement, pan, zoom, orbit,
    camera cuts, cropped hooves, extra legs, missing legs, distorted anatomy,
    changing saddle, changing appearance, changing background, flicker
