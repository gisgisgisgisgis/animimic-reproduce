# Controlled loss-weight experiment based on run f1b99e856044.
# Same video settings; weights are project choices, not published paper values.
asset: horse_textured
camera:
  width: 768
  height: 448
  azimuth: 65
  elevation: 5
  distance: 1.5
  lighting: unlit
  srgb: true
  use_texture: true
video:
  prompt: The brown horse lowers its head to sniff the ground, lifts its head, then
    turns its head slightly toward the viewer. Its neck visibly bends. Its ears swivel
    and its tail swishes while it shifts its weight and briefly lifts one front hoof,
    then places it back on the same spot. The same horse remains centered and fully
    visible with consistent coat markings and proportions. The camera and plain background
    stay fixed throughout this continuous five-second shot.
  negative_prompt: second horse, duplicate animal, animal entering the frame, walking
    away, running forward, travelling, sliding hooves, drifting body, camera movement,
    camera shake, pan, zoom, orbit, camera cuts, frozen pose, still image, missing
    legs, extra legs, distorted anatomy, changing markings, changing background, flicker
  seed: 2026
  sample_frames: 25
  backend: wan
joints:
  iterations: 700
  learning_rate: 0.001
  rotation_bound: 1.0
  translation_bound: 0.1
  loss_weights:
    rgb: 1.0
    mask: 1.0
    track: 1.0
    depth: 1.0
    smooth: 10000.0
    regularization: 1000.0
