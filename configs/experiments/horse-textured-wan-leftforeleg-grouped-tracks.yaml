asset: horse_textured
camera:
  width: 768
  height: 448
  azimuth: 65
  elevation: 5
  distance: 1.5
  lighting: unlit
  srgb: true
  use_texture: true
video:
  backend: wan
  cpu_export: true
  use_negative_prompt: false
  prompt: The brown horse stands still and slowly lifts its left front leg, bending
    the knee so the hoof rises off the ground, holds it up briefly, then places the
    hoof back down on the same spot. The rest of the body stays still and in the same
    place. The same horse keeps consistent coat markings and proportions. The camera
    and plain background stay fixed throughout this continuous five-second shot.
  negative_prompt: second horse, duplicate animal, walking, running, sliding hooves,
    drifting body, camera movement, camera shake, pan, zoom, orbit, camera cuts, frozen
    pose, still image, missing legs, extra legs, distorted anatomy, melting body,
    changing markings, changing background, flicker
  seed: 2026
  num_frames: 121
  fps: 24
  sample_frames: 25
  num_inference_steps: 50
  guidance_scale: 5.0
# Joint indices for the original horse_textured GLB and its import order.
supervision:
  max_tracks: 512
  track_groups:
    head: [12, 13, 14, 15, 16, 17, 18, 19]
    left foreleg: [20, 21, 22]
    left front hoof: [23, 24, 25]
    right foreleg: [26, 27, 28]
    right front hoof: [29, 30, 31]
    left hind leg: [32, 33, 34, 35, 36, 37]
    right hind leg: [38, 39, 40, 41, 42, 43]
    tail: [44, 45, 46, 47, 48]
joints:
  objective: normalized
  iterations: 3000
  learning_rate: 0.001
  batch_frames: 1
  seed: 0
  confidence_threshold: 0.1
  rotation_bound: 1.0
  translation_bound: 0.01
  loss_weights:
    rgb: 1.0
    mask: 1.0
    track: 10.0
    depth: 1.0
    smooth: 10.0
    regularization: 1000.0
    rigid: 10.0
