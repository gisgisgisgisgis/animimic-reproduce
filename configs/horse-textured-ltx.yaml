  prompt: >-
    The single brown horse in the image slowly lowers its head toward
    its chest, then raises its head back up. Its neck visibly bends
    during the nod. Its ears twitch and its tail swishes once.
    All four hooves remain planted and its body stays in the same spot.
    The same coat markings and proportions remain visible throughout.
    A locked-off camera shows the entire horse at constant scale
    against the unchanged plain background. One horse, one continuous shot.
